        function switchTab(tab) {
            ['dashboard', 'students', 'guide'].forEach(t => {
                const sec = document.getElementById(`tab-${t}`);
                if (sec) sec.classList.add('hidden');
                const btn = document.getElementById(`tab-btn-${t}`);
                if (btn) {
                    btn.className = 'px-3.5 py-2 rounded-xl text-sm font-medium text-indigo-100 hover:bg-indigo-800 transition flex items-center gap-1.5';
                }
            });
            const activeSec = document.getElementById(`tab-${tab}`);
            if (activeSec) activeSec.classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-btn-${tab}`);
            if (activeBtn) {
                activeBtn.className = 'px-3.5 py-2 rounded-xl text-sm font-medium bg-indigo-700 text-white shadow-sm transition flex items-center gap-1.5';
            }
        }

        function cleanIC(str) {
            if (!str) return '';
            return String(str).replace(/[-\s]/g, '').trim();
        }

        function formatIC(ic) {
            const c = cleanIC(ic);
            if (c.length === 12) {
                return `${c.slice(0, 6)}-${c.slice(6, 8)}-${c.slice(8, 12)}`;
            }
            return c || '-';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            if (!toast || !msgEl) return;
            msgEl.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3200);
        }

        function saveToStorage() {
            try {
                localStorage.setItem('ewaris_students_data', JSON.stringify(students));
                localStorage.setItem('ewaris_paid_families', JSON.stringify(paidFamiliesMap));
            } catch (e) {}
        }

        function processFamilies() {
            const parentGraph = {};
            students.forEach((s, idx) => {
                const kp1 = cleanIC(s.kpBapa);
                const kp2 = cleanIC(s.kpIbu);
                if (kp1) {
                    if (!parentGraph[kp1]) parentGraph[kp1] = [];
                    parentGraph[kp1].push(idx);
                }
                if (kp2) {
                    if (!parentGraph[kp2]) parentGraph[kp2] = [];
                    parentGraph[kp2].push(idx);
                }
            });

            const visited = new Array(students.length).fill(false);
            groupedFamilies = [];
            studentFamilyMap = {};

            for (let i = 0; i < students.length; i++) {
                if (visited[i]) continue;

                const queue = [i];
                visited[i] = true;
                const memberIndices = [];

                while (queue.length > 0) {
                    const curr = queue.shift();
                    memberIndices.push(curr);
                    const s = students[curr];
                    const kps = [cleanIC(s.kpBapa), cleanIC(s.kpIbu)].filter(Boolean);

                    kps.forEach(kp => {
                        const neighbors = parentGraph[kp] || [];
                        neighbors.forEach(nIdx => {
                            if (!visited[nIdx]) {
                                visited[nIdx] = true;
                                queue.push(nIdx);
                            }
                        });
                    });
                }

                const memberList = memberIndices.map(idx => students[idx]);
                const first = memberList[0];
                const utamaKP = cleanIC(first.kpBapa) || cleanIC(first.kpIbu) || ('FAM_' + i);
                const utamaNama = first.namaBapa || first.namaIbu || 'TIADA MAKLUMAT WARIS';
                const pasanganNama = first.namaIbu || '';
                const pasanganKP = cleanIC(first.kpIbu) || '';
                const telefon = first.telefon || '-';

                let crossMatchNote = '';
                if (memberList.length > 1) {
                    const bapaSet = new Set(memberList.map(m => cleanIC(m.kpBapa)).filter(Boolean));
                    if (bapaSet.size > 1) {
                        crossMatchNote = 'Dikesan melalui padanan silang No. KP Bapa & Ibu';
                    }
                }

                const familyObj = {
                    id: 'KEL_' + utamaKP,
                    utamaKP,
                    utamaNama,
                    pasanganNama,
                    pasanganKP,
                    telefon,
                    anak: memberList,
                    jumlahAnak: memberList.length,
                    lebihSatu: memberList.length > 1,
                    crossMatchNote,
                    isPaid: !!paidFamiliesMap[utamaKP]
                };

                groupedFamilies.push(familyObj);
                memberList.forEach((m, idxInFam) => {
                    studentFamilyMap[m.id] = {
                        family: familyObj,
                        isRepresentative: idxInFam === 0
                    };
                });
            }

            groupedFamilies.sort((a, b) => b.jumlahAnak - a.jumlahAnak);

            populateClassFilter();
            checkDataQuality();
            updateStats();
            renderDashboard();
            renderStudentTable();
        }

        function populateClassFilter() {
            const select = document.getElementById('filter-class');
            if (!select) return;
            const currentVal = select.value;
            const classes = Array.from(new Set(students.map(s => (s.kelas || '').trim().toUpperCase()).filter(Boolean))).sort();
            select.innerHTML = '<option value="all">Semua Kelas</option>' +
                classes.map(c => `<option value="${c}">${c}</option>`).join('');
            if (classes.includes(currentVal)) {
                select.value = currentVal;
            }
        }

        function checkDataQuality() {
            const banner = document.getElementById('data-quality-banner');
            const textEl = document.getElementById('data-quality-text');
            if (!banner || !textEl) return;
            const invalidCount = students.filter(s => {
                const kp1 = cleanIC(s.kpBapa);
                const kp2 = cleanIC(s.kpIbu);
                return (!kp1 || kp1.length < 6) && (!kp2 || kp2.length < 6);
            }).length;

            if (invalidCount > 0) {
                banner.classList.remove('hidden');
                textEl.textContent = `Dikesan ${invalidCount} rekod murid yang tiada No. KP Waris yang lengkap. Sila kemaskini untuk ketepatan pengesanan adik-beradik.`;
            } else {
                banner.classList.add('hidden');
            }
        }

        function updateStats() {
            const totalStudents = students.length;
            const totalFamilies = groupedFamilies.length;
            const multiFamilies = groupedFamilies.filter(f => f.lebihSatu).length;
            const multiStudents = groupedFamilies.filter(f => f.lebihSatu).reduce((acc, f) => acc + f.jumlahAnak, 0);
            const paidCount = groupedFamilies.filter(f => f.isPaid).length;
            const percentage = totalFamilies > 0 ? Math.round((multiFamilies / totalFamilies) * 100) : 0;

            const el1 = document.getElementById('stat-total-students');
            const elNav = document.getElementById('nav-student-count');
            const elFam = document.getElementById('stat-total-families');
            const elMulti = document.getElementById('stat-multi-families');
            const elPerc = document.getElementById('stat-multi-percentage');
            const elPaid = document.getElementById('stat-pibg-paid');
            const elMultiStu = document.getElementById('stat-multi-students');

            if (el1) el1.textContent = totalStudents;
            if (elNav) elNav.textContent = totalStudents;
            if (elFam) elFam.textContent = totalFamilies;
            if (elMulti) elMulti.textContent = multiFamilies;
            if (elPerc) elPerc.textContent = `${percentage}%`;
            if (elPaid) elPaid.textContent = `${paidCount} / ${totalFamilies}`;
            if (elMultiStu) elMultiStu.textContent = `${multiStudents} Murid`;
        }

        function renderDashboard() {
            const searchInput = document.getElementById('search-input');
            const filterTypeEl = document.getElementById('filter-type');
            const filterClassEl = document.getElementById('filter-class');
            const clearBtn = document.getElementById('clear-search-btn');

            const query = (searchInput ? searchInput.value : '').trim().toLowerCase();
            const cleanQuery = cleanIC(query);
            const filterType = filterTypeEl ? filterTypeEl.value : 'all';
            const filterClass = filterClassEl ? filterClassEl.value : 'all';

            if (clearBtn) {
                if (query.length > 0) clearBtn.classList.remove('hidden');
                else clearBtn.classList.add('hidden');
            }

            const filtered = groupedFamilies.filter(f => {
                if (filterType === 'multi' && !f.lebihSatu) return false;
                if (filterType === 'single' && f.lebihSatu) return false;
                if (filterType === '3plus' && f.jumlahAnak < 3) return false;
                if (filterType === 'unpaid' && f.isPaid) return false;
                if (filterType === 'paid' && !f.isPaid) return false;

                if (filterClass !== 'all') {
                    const hasClass = f.anak.some(a => (a.kelas || '').toUpperCase() === filterClass);
                    if (!hasClass) return false;
                }

                if (!query) return true;

                const matchWaris = f.utamaNama.toLowerCase().includes(query) ||
                    f.pasanganNama.toLowerCase().includes(query) ||
                    (cleanQuery && (f.utamaKP.includes(cleanQuery) || f.pasanganKP.includes(cleanQuery)));

                const matchAnak = f.anak.some(a =>
                    a.nama.toLowerCase().includes(query) ||
                    a.kelas.toLowerCase().includes(query) ||
                    (cleanQuery && cleanIC(a.mykid).includes(cleanQuery))
                );

                return matchWaris || matchAnak;
            });

            const badgeCount = document.getElementById('result-badge-count');
            if (badgeCount) badgeCount.textContent = `${filtered.length} keluarga ditemui`;
            const container = document.getElementById('family-cards-container');
            if (!container) return;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full bg-white p-10 rounded-2xl border border-slate-200 text-center space-y-2">
                        <i class="ph-duotone ph-magnifying-glass text-4xl text-slate-400"></i>
                        <p class="text-base font-bold text-slate-700">Tiada Rekod Keluarga Ditemui</p>
                        <p class="text-xs text-slate-500">Cuba tukar tapisan status atau kata kunci carian anda.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(f => {
                const badgeColor = f.lebihSatu
                    ? 'bg-emerald-100 text-emerald-800 border-emerald-300'
                    : 'bg-slate-100 text-slate-700 border-slate-200';
                const statusLabel = f.lebihSatu
                    ? `LEBIH 1 ANAK (${f.jumlahAnak} BERADIK)`
                    : '1 ANAK DI SEKOLAH';

                const pibgBtnClass = f.isPaid
                    ? 'bg-emerald-600 text-white hover:bg-emerald-700'
                    : 'bg-amber-100 text-amber-900 hover:bg-amber-200 border border-amber-300';

                const anakRows = f.anak.map((a, idx) => `
                    <div class="flex items-center justify-between py-2 px-3 rounded-xl ${idx === 0 ? 'bg-indigo-50/70 border border-indigo-100' : 'bg-slate-50 border border-slate-100'}">
                        <div class="min-w-0 pr-2">
                            <p class="text-xs font-bold text-slate-800 truncate">${idx + 1}. ${a.nama}</p>
                            <p class="text-[11px] text-slate-500 font-mono">MyKid: ${formatIC(a.mykid)} • <span class="font-semibold text-indigo-700">${a.kelas}</span></p>
                        </div>
                        <span class="shrink-0 text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase ${idx === 0 ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-700'}">
                            ${idx === 0 ? 'Wakil PIBG' : 'Dikecualikan'}
                        </span>
                    </div>
                `).join('');

                return `
                    <div class="bg-white rounded-2xl shadow-sm border ${f.lebihSatu ? 'border-emerald-200' : 'border-slate-200'} p-5 flex flex-col justify-between space-y-4">
                        <div class="space-y-3">
                            <div class="flex items-start justify-between gap-2">
                                <div>
                                    <span class="inline-block text-[11px] font-extrabold px-2.5 py-0.5 rounded-full border ${badgeColor}">
                                        ${statusLabel}
                                    </span>
                                    <h4 class="text-base font-bold text-slate-900 mt-1.5">${f.utamaNama}</h4>
                                    <p class="text-xs text-slate-500 font-mono">No. KP Waris: <strong class="text-slate-700">${formatIC(f.utamaKP)}</strong> • Tel: ${f.telefon}</p>
                                    ${f.pasanganNama ? `<p class="text-xs text-slate-500 mt-0.5">Pasangan: ${f.pasanganNama} (${formatIC(f.pasanganKP)})</p>` : ''}
                                </div>
                            </div>

                            ${f.crossMatchNote ? `
                                <div class="bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-xl flex items-center gap-2 text-xs text-amber-900">
                                    <i class="ph-fill ph-sparkle text-amber-600"></i>
                                    <span>${f.crossMatchNote}</span>
                                </div>
                            ` : ''}

                            <div class="space-y-1.5 pt-1">
                                <p class="text-[11px] font-bold uppercase text-slate-400">Senarai Anak Di Sekolah (${f.jumlahAnak} Orang):</p>
                                ${anakRows}
                            </div>
                        </div>

                        <div class="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 no-print">
                            <button onclick="togglePibgPaid('${f.utamaKP}')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${pibgBtnClass}">
                                <i class="ph-bold ${f.isPaid ? 'ph-check-circle' : 'ph-wallet'}"></i>
                                ${f.isPaid ? 'PIBG Selesai Dibayar' : 'Tandakan Bayar PIBG'}
                            </button>
                            <div class="flex items-center gap-1.5">
                                <button onclick="openWhatsAppWaris('${f.utamaKP}')" class="px-2.5 py-1.5 bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 rounded-xl text-xs font-bold transition flex items-center gap-1">
                                    <i class="ph-fill ph-whatsapp-logo text-sm"></i> WhatsApp
                                </button>
                                <button onclick="openSlipModal('${f.utamaKP}')" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition flex items-center gap-1">
                                    <i class="ph-bold ph-printer"></i> Slip Bukti
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderStudentTable() {
            const tbody = document.getElementById('student-table-body');
            if (!tbody) return;
            const searchEl = document.getElementById('student-table-search');
            const q = (searchEl ? searchEl.value : '').trim().toLowerCase();

            const list = students.filter(s => {
                if (!q) return true;
                return s.nama.toLowerCase().includes(q) ||
                    s.kelas.toLowerCase().includes(q) ||
                    s.namaBapa.toLowerCase().includes(q) ||
                    cleanIC(s.kpBapa).includes(q);
            });

            tbody.innerHTML = list.map((s, idx) => {
                const mapInfo = studentFamilyMap[s.id];
                const fam = mapInfo ? mapInfo.family : null;
                const isRep = mapInfo ? mapInfo.isRepresentative : true;
                const bil = fam ? fam.jumlahAnak : 1;

                return `
                    <tr class="hover:bg-slate-50">
                        <td class="py-3 px-4 font-medium text-slate-500">${idx + 1}</td>
                        <td class="py-3 px-4">
                            <p class="font-bold text-slate-800">${s.nama}</p>
                            <p class="text-xs text-slate-500 font-mono">${formatIC(s.mykid)}</p>
                        </td>
                        <td class="py-3 px-4 font-semibold text-indigo-700">${s.kelas}</td>
                        <td class="py-3 px-4">
                            <p class="font-medium text-slate-800">${s.namaBapa || '-'}</p>
                            <p class="text-xs text-slate-500 font-mono">${formatIC(s.kpBapa)}</p>
                        </td>
                        <td class="py-3 px-4">
                            <p class="font-medium text-slate-800">${s.namaIbu || '-'}</p>
                            <p class="text-xs text-slate-500 font-mono">${formatIC(s.kpIbu)}</p>
                        </td>
                        <td class="py-3 px-4 text-center">
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${bil > 1 ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}">
                                ${bil > 1 ? `${bil} Beradik` : '1 Anak'}
                            </span>
                        </td>
                        <td class="py-3 px-4 text-center">
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${isRep ? 'bg-indigo-100 text-indigo-800' : 'bg-amber-50 text-amber-800'}">
                                ${isRep ? 'WAKIL KELUARGA' : 'DIKECUALIKAN'}
                            </span>
                        </td>
                        <td class="py-3 px-4 text-right space-x-1">
                            <button onclick="editStudent('${s.id}')" class="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded-lg" title="Edit">
                                <i class="ph-bold ph-pencil-simple"></i>
                            </button>
                            <button onclick="deleteStudent('${s.id}')" class="p-1.5 text-rose-600 hover:bg-rose-50 rounded-lg" title="Padam">
                                <i class="ph-bold ph-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function togglePibgPaid(utamaKP) {
            paidFamiliesMap[utamaKP] = !paidFamiliesMap[utamaKP];
            saveToStorage();
            processFamilies();
            showToast(paidFamiliesMap[utamaKP] ? 'Ditandakan selesai bayar PIBG!' : 'Status bayaran PIBG dikemaskini.');
        }

        function openWhatsAppWaris(utamaKP) {
            const fam = groupedFamilies.find(f => f.utamaKP === utamaKP);
            if (!fam) return;
            let phone = cleanIC(fam.telefon);

        function processPastedData() {

                showToast('Sila tampal baris data daripada Excel terlebih dahulu.');
                return;
            }
            const replaceAllEl = document.getElementById('paste-replace-all');
            const replaceAll = replaceAllEl ? replaceAllEl.checked : false;
            const lines = raw.split(/\r\n|\n/).filter(l => l.trim() !== '');
            const added = [];

            lines.forEach((line, idx) => {
                const cols = line.includes('\t') ? line.split('\t').map(c => c.trim()) : parseCSVRow(line);
                if (idx === 0 && (cols[0].toLowerCase().includes('nama') || (cols[1] && cols[1].toLowerCase().includes('mykid')))) {
                    return;

                if (cols.length >= 4 && cols[0]) {

                        nama: cols[0].toUpperCase(),
                        mykid: cleanIC(cols[1] || ''),

                        namaIbu: (cols[5] || '').toUpperCase(),
                        kpIbu: cleanIC(cols[6] || ''),

                    });
                }
            });

            if (added.length === 0) {
                showToast('Tiada baris sah dapat diproses. Semak susunan lajur.');
                return;
            }

            if (replaceAll) {
                students = added;
            } else {
                students = [...added, ...students];
            }

            saveToStorage();
            processFamilies();
            closePasteModal();
            ta.value = '';
            showToast(`Berjaya memasukkan ${added.length} rekod murid!`);
        }

        function saveAndConnectGoogleSheet() {
            const urlInp = document.getElementById('inp-sheet-url');
            const intervalInp = document.getElementById('inp-sync-interval');
            if (!urlInp) return;
            let rawUrl = urlInp.value.trim();
            const intervalSec = intervalInp ? parseInt(intervalInp.value) || 60 : 60;

            if (!rawUrl) {
                showToast('Sila masukkan pautan URL Google Sheets.');
                return;
            }

            // Sanitasi pautan URL Google Sheets supaya sentiasa merujuk kepada eksport CSV yang sah
            let csvUrl = rawUrl;
            if (rawUrl.includes('/edit')) {
                csvUrl = rawUrl.split('/edit')[0] + '/export?format=csv';
            } else if (rawUrl.includes('/pubhtml')) {
                csvUrl = rawUrl.replace('/pubhtml', '/pub?output=csv');
            } else if (!rawUrl.includes('output=csv') && !rawUrl.includes('format=csv')) {
                if (rawUrl.includes('?')) {
                    csvUrl = rawUrl + '&output=csv';
                } else {
                    csvUrl = rawUrl + '/export?format=csv';
                }
            }

            googleSheetConfig = {
                url: csvUrl,
                originalUrl: rawUrl,
                intervalSec: intervalSec,
                lastSync: 'Baru sahaja'
            };

            localStorage.setItem('ewaris_gsheet_config', JSON.stringify(googleSheetConfig));
            closeSheetSyncModal();
            updateSyncUI();
            setupAutoSyncTimer();
            syncFromGoogleSheet(true);
        }

        function syncFromGoogleSheet(showAlert = true) {
            if (!googleSheetConfig.url) {
                if (showAlert) showToast('Tiada pautan Google Sheets disambungkan.');
                return;
            }

            if (showAlert) showToast('Sedang menarik data terkini dari Google Sheets...');

            // Cuba fetch menggunakan pautan CSV terus, jika gagal gunakan CORS proxy alternatif
            fetch(googleSheetConfig.url)
                .then(response => {
                    if (!response.ok) throw new Error('Gagal mengakses pautan Google Sheets (Pastikan akses "Anyone with the link" diaktifkan).');
                    return response.text();
                })
                .then(text => {
                    // Jika Google Sheet memulangkan halaman HTML ralat log masuk / kebenaran
                    if (text.trim().toLowerCase().startsWith('<!doctype html') || text.includes('accounts.google.com')) {
                        throw new Error('Google Sheets menyekat akses. Sila pastikan anda sudah tekan "Publish to web" (Format CSV) atau tukar Share kepada "Anyone with the link (Viewer)".');
                    }

                    const lines = text.split(/\r\n|\n/).filter(l => l.trim() !== '');
                    const imported = [];
                    lines.forEach((line, idx) => {
                        const cols = parseCSVRow(line);
                        if (idx === 0 && (cols[0].toLowerCase().includes('nama') || (cols[1] && cols[1].toLowerCase().includes('mykid')))) {
                            return;
                        }
                        if (cols.length >= 4 && cols[0]) {
                            imported.push({
                                id: 'GS_' + idx + '_' + Date.now(),
                                nama: cols[0].toUpperCase(),
                                mykid: cleanIC(cols[1] || ''),
                                kelas: (cols[2] || 'TIADA KELAS').toUpperCase(),
                                namaBapa: (cols[3] || '').toUpperCase(),
                                kpBapa: cleanIC(cols[4] || ''),
                                namaIbu: (cols[5] || '').toUpperCase(),
                                kpIbu: cleanIC(cols[6] || ''),
                                telefon: cols[7] || '-'
                            });
                        }
                    });

                    if (imported.length > 0) {
                        students = imported;
                        saveToStorage();
                        processFamilies();
                        const now = new Date();
                        googleSheetConfig.lastSync = now.toLocaleTimeString();
                        localStorage.setItem('ewaris_gsheet_config', JSON.stringify(googleSheetConfig));
                        updateSyncUI();
                        if (showAlert) showToast(`Berjaya sinkronisasi ${imported.length} rekod murid dari Google Sheets!`);
                    } else {
                        if (showAlert) showToast('Amaran: Tiada data sah dijumpai. Pastikan susunan lajur bermula dari Lajur A.');
                    }
                })
                .catch(err => {
                    console.error(err);
                    // Cuba kaedah fallback menggunakan CORS proxy jika fetch terus disekat browser
                    if (showAlert) {
                        showToast('Mencuba sambungan alternatif...');
                    }
                    fallbackFetchGoogleSheet(googleSheetConfig.originalUrl || googleSheetConfig.url, showAlert);
                });
        }

        function fallbackFetchGoogleSheet(url, showAlert) {
            // Gunakan AllOrigins CORS proxy sebagai sandaran jika Google Sheets menyekat permintaan terus
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url.includes('export?format=csv') ? url : url + '/export?format=csv')}`;
            
            fetch(proxyUrl)
                .then(res => res.json())
                .then(data => {
                    if (!data || !data.contents) throw new Error('Gagal membaca kandungan dari proxy.');
                    const text = data.contents;
                    const lines = text.split(/\r\n|\n/).filter(l => l.trim() !== '');
                    const imported = [];
                    lines.forEach((line, idx) => {
                        const cols = parseCSVRow(line);
                        if (idx === 0 && (cols[0].toLowerCase().includes('nama') || (cols[1] && cols[1].toLowerCase().includes('mykid')))) {
                            return;
                        }
                        if (cols.length >= 4 && cols[0]) {
                            imported.push({
                                id: 'GS_PRX_' + idx + '_' + Date.now(),
                                nama: cols[0].toUpperCase(),
                                mykid: cleanIC(cols[1] || ''),
                                kelas: (cols[2] || 'TIADA KELAS').toUpperCase(),
                                namaBapa: (cols[3] || '').toUpperCase(),
                                kpBapa: cleanIC(cols[4] || ''),
                                namaIbu: (cols[5] || '').toUpperCase(),
                                kpIbu: cleanIC(cols[6] || ''),
                                telefon: cols[7] || '-'
                            });
                        }
                    });

                    if (imported.length > 0) {
                        students = imported;
                        saveToStorage();
                        processFamilies();
                        const now = new Date();
                        googleSheetConfig.lastSync = now.toLocaleTimeString();
                        localStorage.setItem('ewaris_gsheet_config', JSON.stringify(googleSheetConfig));
                        updateSyncUI();
                        if (showAlert) showToast(`Berjaya sinkronisasi ${imported.length} rekod melalui pelayan sandaran!`);
                    } else {
                        if (showAlert) showToast('Ralat: Fail Google Sheets kosong atau format tidak sah.');
                    }
                })
                .catch(err2 => {
                    console.error(err2);
                    if (showAlert) showToast('Ralat sambungan Google Sheets. Sila pastikan fail telah di-Publish ke web.');
                });
        }

        function parseCSVRow(text) {
            const result = [];
            let insideQuote = false;
            let entry = '';
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (c === '"') {
                    insideQuote = !insideQuote;
                } else if (c === ',' && !insideQuote) {
                    result.push(entry.trim().replace(/^"|"$/g, ''));
                    entry = '';
                } else {
                    entry += c;
                }
            }
            result.push(entry.trim().replace(/^"|"$/g, ''));
            return result;
        }

                if (timestampEl) timestampEl.textContent = `Kemaskini terakhir: ${timeStr} • ${intervalText}`;
            } else {
                if (banner) banner.classList.add('hidden');
                if (label) label.textContent = 'Sambung Google Sheets (Live)';
            }
        }

        // Initialize application on window load
        window.onload = async function() {
            await initFirebaseAndSync();
        };

        // ==========================================
        // FIREBASE CLOUD SYNC & AUTHENTICATION
        // ==========================================
        let db, auth, currentUser = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'sekolah-ewaris-default-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        async function initFirebaseAndSync() {
            const statusText = document.getElementById('cloud-status-text');
            const statusDot = document.getElementById('cloud-status-dot');

            if (!firebaseConfig || !window.firebaseModules) {
                // Fallback to localStorage if Firebase is not provided
                if (statusText) statusText.textContent = 'Mod Storan Tempatan (Local Storage)';
                if (statusDot) statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-blue-400';
                loadFromLocalFallback();
                return;
            }

            try {
                const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, collection, doc, onSnapshot } = window.firebaseModules;
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Authentication
                const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : undefined;
                if (initialToken) {
                    await signInWithCustomToken(auth, initialToken);
                } else {
                    await signInAnonymously(auth);
                }

                currentUser = auth.currentUser;

                // Real-time listener for public cloud data (Using even-segment path collection/doc/collection/doc)
                const dataDocRef = doc(db, 'artifacts', appId, 'public_data', 'school_records');
                
                onSnapshot(dataDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const cloudData = docSnap.data();
                        if (cloudData.students && Array.isArray(cloudData.students)) {
                            students = cloudData.students;
                        }
                        if (cloudData.paidFamiliesMap) {
                            paidFamiliesMap = cloudData.paidFamiliesMap;
                        }
                        processFamilies();
                        if (statusText) statusText.textContent = 'Cloud Sync Aktif (Multi-Peranti)';
                        if (statusDot) statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-emerald-400';
                    } else {
                        // Initialize cloud with sample data if empty
                        loadSampleData(false);
                        saveToCloud();
                    }
                }, (error) => {
                    // Handle permission errors silently by using robust local storage fallback
                    if (statusText) statusText.textContent = 'Mod Storan Tempatan (Sedia Digunakan)';
                    if (statusDot) statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-blue-400';
                    loadFromLocalFallback();
                });

            } catch (err) {
                if (statusText) statusText.textContent = 'Mod Storan Tempatan (Sedia Digunakan)';
                if (statusDot) statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-blue-400';
                loadFromLocalFallback();
            }
        }

        function loadFromLocalFallback() {
            try {
                const savedStudents = localStorage.getItem('ewaris_students_data');
                const savedPaid = localStorage.getItem('ewaris_paid_families');
                const savedConfig = localStorage.getItem('ewaris_gsheet_config');

                if (savedStudents) {
                    students = JSON.parse(savedStudents);
                } else {
                    loadSampleData(false);
                }

                if (savedPaid) {
                    paidFamiliesMap = JSON.parse(savedPaid);
                }

                if (savedConfig) {
                    googleSheetConfig = JSON.parse(savedConfig);
                    updateSyncUI();
                    setupAutoSyncTimer();
                }
            } catch (e) {
                loadSampleData(false);
            }
            processFamilies();
        }

        async function saveToStorage() {
            // Save locally as backup
            try {
                localStorage.setItem('ewaris_students_data', JSON.stringify(students));
                localStorage.setItem('ewaris_paid_families', JSON.stringify(paidFamiliesMap));
            } catch (e) {}

            // Save to Cloud Firestore if connected
            await saveToCloud();
        }

        async function saveToCloud() {
            if (!db || !auth || !auth.currentUser) return;
            try {
                const { doc, setDoc } = window.firebaseModules;
                const dataDocRef = doc(db, 'artifacts', appId, 'public_data', 'school_records');
                await setDoc(dataDocRef, {
                    students: students,
                    paidFamiliesMap: paidFamiliesMap,
                    updatedAt: new Date().toISOString(),
                    updatedBy: auth.currentUser.uid
                }, { merge: true });
            } catch (e) {
                // Silently handle insufficient permissions by relying on high-speed localStorage
            }
        }
    </script>
</body>
